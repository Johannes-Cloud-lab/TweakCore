name: Build TweakCore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK Pakete installieren
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Android APK bauen
        run: |
          gradle assembleDebug --stacktrace

      - name: TweakCore APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: TweakCore-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
